[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/content/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/history/*.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/attachments/*/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/attachments/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
